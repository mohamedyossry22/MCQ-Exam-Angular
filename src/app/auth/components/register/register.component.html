<div class="register">
    <div class="text-center registhead">
        <h2>Register</h2>
    </div>
    <form [formGroup]="userForm">
        <div class="row">
            <div class="col-sm-12 mb-3">        
                <mat-radio-group formControlName="type" (change)="getType($event)" > 
                    <mat-radio-button value="STUDENT"  class="w-25" color="warn">طالب</mat-radio-button>
                    <mat-radio-button value="PROF" class="w-25" color="warn">دكتور</mat-radio-button>
                </mat-radio-group>
            </div>
            <div class="col-md-6 col-sm-12">
                <mat-form-field appearance="outline" color="warn">
                    <mat-label>الاسم</mat-label>
                    <input matInput type="text" formControlName="username" >
                    <!-- <mat-hint color="warn">must more than 5</mat-hint> -->
                </mat-form-field>
            </div>

            <div class="col-md-6 col-sm-12">          
                <mat-form-field appearance="outline" color="warn">                    
                    <mat-label>الايميل</mat-label>
                    <input matInput type="email" formControlName="email" >
                </mat-form-field>
            </div>

            <div class="col-md-6 col-sm-12">
                <mat-form-field appearance="outline" color="warn">
                    <mat-label>كلمة المرور</mat-label>
                    <input matInput type="password" formControlName="password" >
                </mat-form-field>
            </div>

            <div class="col-md-6 col-sm-12">             
                <mat-form-field appearance="outline" color="warn">
                    <mat-label>تاكيد كلمة المرور</mat-label>
                    <input matInput type="password" formControlName="confirmPassword" >
                </mat-form-field>
            </div>
            <div class="col-md-6 col-sm-12" *ngIf="userForm.value['type'] == 'PROF'">             
                <mat-form-field appearance="outline" color="warn">
                    <mat-label>كود المحاضر</mat-label>
                    <input matInput type="number" formControlName="code" >
                </mat-form-field>
            </div>
        </div>
      <div class="text-right registfoot">
          <a routerLink="/login" color="primary">املك حساب بالفعل ؟</a>
            <button mat-raised-button color="warn" [disabled]="userForm.invalid || (userForm.value.password !== userForm.value.confirmPassword)" (click)="submit()">انشاء الحساب</button>
      </div>
     </form>
</div>
